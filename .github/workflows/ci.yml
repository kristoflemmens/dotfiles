name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: shellcheck
        # -x: follow `source`d files (bin/lib/) like a local `shellcheck -x`.
        run: shellcheck -x bin/*.sh bin/lib/*.sh dot_git-template/hooks/executable_pre-commit
      - name: zsh syntax
        run: |
          sudo apt-get install -y zsh >/dev/null
          # One file per call: `zsh -n a b` only checks a (b is an argument).
          git ls-files -z -- dot_zshrc dot_zshenv dot_zprofile '*.zsh' |
            xargs -0 -n1 zsh -n
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  render:
    # Renders every template and script for personal and non-personal Macs without touching a
    # real home directory, so a broken template fails here instead of on
    # `chezmoi apply`.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        personal: [true, false]
    steps:
      - uses: actions/checkout@v4
      - name: install chezmoi
        run: sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"
      - name: render
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          mkdir -p "$RUNNER_TEMP/home"
          chezmoi init --source "$GITHUB_WORKSPACE" --promptBool "Personal Mac=${{ matrix.personal }}"
          chezmoi apply --source "$GITHUB_WORKSPACE" --no-pager --dry-run --verbose --exclude=externals \
            --destination "$RUNNER_TEMP/home" > /dev/null

  tests:
    # macOS so bin/ scripts run under its /bin/bash 3.2, as on the Macs.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install --quiet bats-core
      - run: bats tests/

  zsh-startup:
    # Starts a real interactive login shell with the applied dotfiles and
    # plugins: `zsh -n` misses runtime errors (a stray command, a plugin that
    # no longer loads), which would otherwise show up in every new terminal.
    runs-on: macos-latest   # arm64, Homebrew in /opt/homebrew like path.zsh expects
    steps:
      - uses: actions/checkout@v4
      - name: install shell tools
        # The image ships a stale package index (it once installed an older Starship
        # that warned about newer config keys); refresh it so versions match the Macs.
        run: brew update --quiet && brew install --quiet chezmoi antidote starship zoxide fzf fd eza bat
      - name: apply
        # The runner's home is throwaway; scripts (brew bundle, defaults) are skipped.
        run: |
          chezmoi init --source "$GITHUB_WORKSPACE" --promptBool "Personal Mac=false"
          chezmoi apply --source "$GITHUB_WORKSPACE" --no-pager --force --exclude=externals,scripts
      - name: start zsh
        run: |
          zsh -il -c true   # first start: antidote clones the plugins (and says so on stderr)
          rc=0
          # Inside a pseudo-terminal, like a real tab: zle (fzf's key bindings) needs one.
          script -q /dev/null sh -c 'zsh -il -c "whence -w gst cdi fzf-history-widget _help_pager && [[ \$STARSHIP_SHELL == zsh ]]" 2>stderr.txt' || rc=$?
          cat stderr.txt
          # Plugins and the prompt must load, and startup must be silent.
          [[ $rc == 0 && ! -s stderr.txt ]]
