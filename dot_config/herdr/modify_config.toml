{{- /* chezmoi:modify-template */ -}}
{{- /* Lays .chezmoitemplates/herdr-settings.toml over the current file
       (tables merged, the shared value wins); keys herdr writes itself
       stay. Before herdr's first run there is no file yet. */ -}}
{{- $config := dict -}}
{{- if .chezmoi.stdin }}{{ $config = .chezmoi.stdin | fromToml }}{{ end -}}
{{ toToml (mergeOverwrite $config (includeTemplate "herdr-settings.toml" . | fromToml)) }}
