# Externals for every machine, refreshed weekly by `chezmoi apply` (or now
# with --refresh-externals).
#
# The oh-my-zsh alias sets that get used (git, kubectl, brew, eza) as plain
# files, without the framework; sourced by ~/.zshrc. zsh plugins themselves
# come from Homebrew.
#
# Machine-specific externals go in their own file next to this one, e.g.
# personal.yaml.tmpl gated on the personal flag, or in an overlay repo's own
# .chezmoiexternals/. Files here are always parsed as templates: keep double
# braces out of comments.

.config/zsh/ohmyzsh:
  type: archive
  url: https://github.com/ohmyzsh/ohmyzsh/archive/refs/heads/master.tar.gz
  stripComponents: 1
  exact: true
  refreshPeriod: 168h
  # Parent directories must be listed too, or their contents are skipped.
  include:
    - "*/lib"
    - "*/lib/git.zsh"
    - "*/plugins"
    - "*/plugins/git"
    - "*/plugins/git/**"
    - "*/plugins/kubectl"
    - "*/plugins/kubectl/**"
    - "*/plugins/brew"
    - "*/plugins/brew/**"
    - "*/plugins/eza"
    - "*/plugins/eza/**"
